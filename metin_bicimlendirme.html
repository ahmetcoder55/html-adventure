<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metin Biçimlendirme</title>
</head>
<body>

<p>Bu yazı <strong>kalın (bold)</strong> görünür.</p>
<p>Bu yazı <em>eğik (italic)</em> görünür.</p>
<p>Bu yazının <mark>arkası sarı ile vurgulanmıştır</mark>.</p>
<p>Bu yazının üstü <del>çizilidir</del>.</p>
</body>
</html>
